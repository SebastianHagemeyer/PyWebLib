<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Brython lab</title>
<style>
  :root { --bg: #0f1226; --panel: #171b36; --ink: #e6e7ef; --muted: #9aa0c3; --accent: #4ea8ff; --bad: #ff8a8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 14px; }
  a { color: var(--accent); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 500px); gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  textarea { width: 100%; height: 560px; resize: vertical; background: var(--panel); color: var(--ink);
    border: 1px solid #2a3060; border-radius: 8px; padding: 10px; tab-size: 4;
    font: 13px/1.45 ui-monospace, Consolas, monospace; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button { background: var(--accent); color: #06122a; border: 0; border-radius: 6px; padding: 7px 16px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid #2a3060; }
  button:disabled { opacity: 0.45; cursor: default; }
  canvas { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; outline: none; touch-action: none; }
  canvas:focus { box-shadow: 0 0 0 2px var(--accent); }
  .hud { font: 12px ui-monospace, Consolas, monospace; color: #7ee787; min-height: 1.5em; margin: 6px 0; }
  .status { color: var(--muted); font-size: 13px; }
  .status.bad { color: var(--bad); }
  pre#out { background: var(--panel); border-radius: 8px; padding: 10px; min-height: 120px; max-height: 240px; overflow: auto;
    font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 0; }
  pre#out .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Brython lab</h1>
  <p class="lead">An experiment: the same <code>import game</code> code, run by
    <a href="https://brython.info/" target="_blank" rel="noopener">Brython</a> (Python compiled to JavaScript)
    in a Web Worker instead of Pyodide. See <a href="bench.html">the benchmark</a> and the README in this folder.</p>
  <div class="grid">
    <div>
      <div class="bar">
        <button id="run">Run</button>
        <button id="stop" class="ghost" disabled>Stop</button>
        <button id="reset" class="ghost">Load demo</button>
        <span class="status" id="status">Starting...</span>
      </div>
      <textarea id="code" spellcheck="false" aria-label="Python code"></textarea>
    </div>
    <div>
      <canvas id="screen" tabindex="0" aria-label="Game"></canvas>
      <div class="hud" id="hud"></div>
      <pre id="out" aria-label="Output"></pre>
    </div>
  </div>
</main>
<script src="keys.js"></script>
<script src="lab.js"></script>
</body>
</html>
