<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Brython vs Pyodide</title>
<style>
  :root { --bg: #0f1226; --panel: #171b36; --ink: #e6e7ef; --muted: #9aa0c3; --accent: #4ea8ff; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; }
  a { color: var(--accent); }
  p { color: var(--muted); }
  button { background: var(--accent); color: #06122a; border: 0; border-radius: 6px; padding: 7px 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.45; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #2a3060; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  #log { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Brython vs Pyodide: raw Python speed</h1>
  <p>Runs <a href="bench.py">bench.py</a> in both runtimes, one after the other, in this tab.
    Lower is better. Pyodide downloads about 10 MB the first time. <a href="./">Back to the lab</a>.</p>
  <button id="go">Run benchmark</button>
  <div class="wrap">
    <table>
      <thead><tr><th>Measure</th><th>Brython</th><th>Pyodide</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="log"></p>
</main>
<script>
(function () {
  const BRYTHON = "https://cdn.jsdelivr.net/npm/brython@3.14.3/";
  const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/";
  const ROWS = [
    ["load_ms", "Start-up (download + boot), ms"],
    ["obb_ms_per_frame", "Rotated-box collisions, ms/frame"],
    ["aabb_ms_per_frame", "Plain box collisions, ms/frame"],
    ["fib22_ms", "fib(22), ms"]
  ];
  const log = function (t) { document.getElementById("log").textContent += t + "\n"; };
  function script(src) {
    return new Promise(function (ok, bad) {
      const s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = function () { bad(new Error("could not load " + src)); };
      document.head.appendChild(s);
    });
  }
  function show(res) {
    const body = document.getElementById("rows");
    body.textContent = "";
    ROWS.forEach(function (r) {
      const tr = document.createElement("tr");
      [r[1], res.b[r[0]], res.p[r[0]]].forEach(function (v, i) {
        const td = document.createElement("td");
        td.textContent = i === 0 ? v : (v == null ? "..." : Number(v).toFixed(1));
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }
  document.getElementById("go").addEventListener("click", async function () {
    this.disabled = true;
    const res = { b: {}, p: {} };
    show(res);
    const src = await (await fetch("bench.py", { cache: "no-cache" })).text();
    try {
      log("Brython: loading...");
      let t = performance.now();
      if (!window.__BRYTHON__) {
        await script(BRYTHON + "brython.min.js");
        await script(BRYTHON + "brython_stdlib.js");
      }
      res.b.load_ms = performance.now() - t;
      log("Brython: running...");
      await new Promise(function (r) { setTimeout(r, 30); });
      __BRYTHON__.runPythonSource(src + "\nfrom browser import window\nwindow.benchOut = dict(RESULT)\n", { id: "bench_b" });
      const o = window.benchOut;
      ["obb_ms_per_frame", "aabb_ms_per_frame", "fib22_ms"].forEach(function (k) { res.b[k] = o.get ? o.get(k) : o[k]; });
      show(res);
    } catch (e) { log("Brython failed: " + (e.message || e)); }
    try {
      log("Pyodide: loading...");
      let t = performance.now();
      await script(PYODIDE + "pyodide.js");
      const py = await loadPyodide({ indexURL: PYODIDE });
      res.p.load_ms = performance.now() - t;
      log("Pyodide: running...");
      await new Promise(function (r) { setTimeout(r, 30); });
      py.runPython(src);
      const m = py.globals.get("RESULT").toJs();
      ["obb_ms_per_frame", "aabb_ms_per_frame", "fib22_ms"].forEach(function (k) { res.p[k] = m.get(k); });
      show(res);
    } catch (e) { log("Pyodide failed: " + (e.message || e)); }
    log("Done.");
    this.disabled = false;
  });
  show({ b: {}, p: {} });
})();
</script>
</body>
</html>
