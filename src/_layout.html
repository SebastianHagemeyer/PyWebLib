<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=3" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="{{root}}styles.css" />
{{head}}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img class="logo-mark" src="/favicon.svg?v=3" alt="" width="32" height="32" />
        <span>PyWebLib</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
{{nav}}
        <span id="pwl-account" class="pwl-account" data-root="{{root}}"></span>
      </nav>
    </div>
  </header>

{{content}}

  <footer class="site-footer">
    <div class="container">
      <p>PyWebLib: real Python in your browser, powered by
        <a href="https://pyodide.org" target="_blank" rel="noopener">Pyodide</a>.{{credits}} MIT licensed.
        &middot; <a href="/privacy/">Privacy</a> &middot; <a href="/terms/">Terms</a></p>
    </div>
  </footer>

{{scripts}}
{{tail}}
</body>
</html>
